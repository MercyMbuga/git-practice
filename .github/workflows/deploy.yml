name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
 steps:
  - name: Connect to EC2
     run: |
      echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
    chmod 600 private_key.pem
    - name: SSH into EC2
       run: |
        ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} "echo 'Connected to EC2!'"
